# Local and server run. Defaults need no credentials: PAYPAL_MODE=mock, AI_MODE=replay.
#   cp .env.example .env && docker compose up --build
# On the team server, also start the HTTPS proxy:
#   docker compose --profile server up -d --build
# Host ports bind to 127.0.0.1 only. If 3000-3002 are taken on the host (for example on a shared
# Dokploy server), set API_HOST_PORT, SHOP_HOST_PORT and OPS_HOST_PORT in .env.
# Spec: docs/specs/0008-hosting-and-deploy.md

x-app: &app
  env_file: .env
  restart: unless-stopped
  # No `networks` here on purpose (#121). Dokploy rewrites this file on deploy and does not resolve `<<: *app` merge keys,
  # so a network inherited from this anchor looks missing to it and is replaced by Dokploy's own network, which strands the
  # service away from `postgres` (`getaddrinfo ENOTFOUND postgres`, Nov 6 and Nov 7). Every service lists `networks: [poi]`
  # itself, and apps/api/src/compose.test.ts fails if one doesn't.
  # Outside names (PayPal, the LLM) go to public resolvers; Docker's embedded DNS still answers service names
  # (postgres, api). The host's resolver dropped lookups on the team server (EAI_AGAIN for
  # api.sandbox.paypal.com, Nov 6), which failed an operator's accept-claim.
  dns: [1.1.1.1, 8.8.8.8]

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: poi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-poi}
      POSTGRES_DB: poi
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poi -d poi"]
      interval: 5s
      retries: 10
    restart: unless-stopped
    # Time for a clean shutdown (Docker's default 10 s can cut off a checkpoint). Changing this service's config
    # also makes the next deploy recreate the container, which reattaches it to the current compose network
    # (Nov 6: a postgres container left on a stale network gave migrate "getaddrinfo ENOTFOUND postgres").
    stop_grace_period: 60s
    networks: [poi]

  # One-shot: applies pending migrations (packages/db/migrations), then exits. Uses the api image.
  migrate:
    <<: *app
    networks: [poi]
    build: { context: ., args: { APP: api } }
    image: ghcr.io/${GHCR_OWNER:-harshkumarsingh12}/proof-of-intent-api:${IMAGE_TAG:-local}
    command: ["pnpm", "--filter", "@poi/db", "migrate"]
    restart: "no"
    depends_on: { postgres: { condition: service_healthy } }

  api:
    <<: *app
    networks: [poi]
    build: { context: ., args: { APP: api } }
    image: ghcr.io/${GHCR_OWNER:-harshkumarsingh12}/proof-of-intent-api:${IMAGE_TAG:-local}
    environment: { PORT: "3000" }
    ports: ["127.0.0.1:${API_HOST_PORT:-3000}:3000"]
    depends_on: { migrate: { condition: service_completed_successfully } }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/healthz || exit 1"]
      interval: 10s
      retries: 5

  worker:
    <<: *app
    networks: [poi]
    build: { context: ., args: { APP: worker } }
    image: ghcr.io/${GHCR_OWNER:-harshkumarsingh12}/proof-of-intent-worker:${IMAGE_TAG:-local}
    depends_on: { migrate: { condition: service_completed_successfully } }

  buyer:
    <<: *app
    networks: [poi]
    build: { context: ., args: { APP: buyer } }
    image: ghcr.io/${GHCR_OWNER:-harshkumarsingh12}/proof-of-intent-buyer:${IMAGE_TAG:-local}
    # The shop's server routes (key registration, the buyer agent, approval) call the API on the compose network.
    environment: { API_INTERNAL_URL: "http://api:3000" }
    ports: ["127.0.0.1:${SHOP_HOST_PORT:-3001}:3001"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/healthz || exit 1"]
      interval: 10s
      retries: 5

  dashboard:
    <<: *app
    networks: [poi]
    build: { context: ., args: { APP: dashboard } }
    image: ghcr.io/${GHCR_OWNER:-harshkumarsingh12}/proof-of-intent-dashboard:${IMAGE_TAG:-local}
    environment: { API_INTERNAL_URL: "http://api:3000" }
    ports: ["127.0.0.1:${OPS_HOST_PORT:-3002}:3002"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3002/healthz || exit 1"]
      interval: 10s
      retries: 5

  # Server only: pg_dump every 24 h into ./backups, keeping 7 days (spec 0008). Restore: docs/SETUP.md.
  # A failed dump never replaces a good file: it's written to .tmp and renamed only on success.
  backup:
    image: postgres:16-alpine
    profiles: [server]
    environment: { PGPASSWORD: "${POSTGRES_PASSWORD:-poi}" }
    volumes: ["./backups:/backups"]
    entrypoint:
      - sh
      - -c
      - |
        set -o pipefail
        while true; do
          f=/backups/poi-$$(date -u +%Y%m%dT%H%M%SZ).sql.gz
          if pg_dump -h postgres -U poi -d poi | gzip > "$$f.tmp"; then mv "$$f.tmp" "$$f"; echo "backup ok $$f"
          else rm -f "$$f.tmp"; echo "backup FAILED" >&2; fi
          find /backups -name 'poi-*.sql.gz' -mtime +6 -delete
          sleep 86400
        done
    depends_on: { migrate: { condition: service_completed_successfully } }
    restart: unless-stopped
    networks: [poi]

  caddy:
    image: caddy:2-alpine
    profiles: [server]
    env_file: .env
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [api, buyer, dashboard]
    restart: unless-stopped
    networks: [poi]

volumes:
  pgdata:
  caddy_data:

networks:
  poi:
