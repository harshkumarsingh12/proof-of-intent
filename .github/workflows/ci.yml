name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # packages/db tests run against a real Postgres (the same major version as compose).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: poi
          POSTGRES_PASSWORD: poi
          POSTGRES_DB: poi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U poi -d poi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test:ci
        env:
          DATABASE_URL: postgres://poi:poi@localhost:5432/poi
      - name: Acceptance-criteria ledger
        if: always()
        run: pnpm ledger
      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      # Fails on a NEW high or critical advisory in production dependencies. The three highs that were reviewed and
      # accepted are in package.json (pnpm.auditConfig.ignoreGhsas), with the reasons in SECURITY.md (#167). It does not
      # block a merge for now: an advisory someone else publishes should not stop an unrelated change days before the
      # deadline. After the hackathon, delete `continue-on-error` so it does.
      - name: Dependency audit (production)
        if: always()
        continue-on-error: true
        run: pnpm audit --prod --audit-level=high

  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Compose file is valid
        run: cp .env.example .env && docker compose config -q
      - name: API image builds
        run: docker build --build-arg APP=api -t poi-api:ci .
